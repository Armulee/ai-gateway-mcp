<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 132" width="640" height="132" role="img" aria-label="Deploy your own copy on Vercel, in one click">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="40" y="26" width="560" height="80" rx="40"/></clipPath>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- A soft glow under the button, breathing. -->
  <rect x="60" y="40" width="520" height="56" rx="28" fill="#fff" opacity="0.18" filter="url(#glow)">
    <animate attributeName="opacity" values="0.12;0.3;0.12" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- A ring that ripples out from the button, like a radar ping. -->
  <rect x="40" y="26" width="560" height="80" rx="40" fill="none" stroke="#fff" stroke-width="1.5">
    <animate attributeName="x" values="40;22" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="26;8" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="560;596" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="80;116" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="40;58" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- The button. -->
  <rect x="40" y="26" width="560" height="80" rx="40" fill="#ededed"/>
  <g clip-path="url(#pill)">
    <rect x="-200" y="26" width="160" height="80" fill="url(#shine)" opacity="0.7">
      <animate attributeName="x" values="-200;-200;640" keyTimes="0;0.55;1" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Vercel's mark, as on its app icon. -->
  <circle cx="86" cy="66" r="26" fill="#000"/>
  <path d="M86 53.5 99 76.5H73Z" fill="#fff"/>

  <text x="128" y="76" fill="#000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.6">Deploy your own copy</text>

  <!-- The arrow nudges toward the click. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="556" cy="66" r="24" fill="#000"/>
    <path d="M545 66H566M559 58.5 566.5 66 559 73.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
