<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="How it works: your chat app calls your own deployment, which calls Vercel AI Gateway, which runs text, image and video models">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#000"/>
    <path id="r0" d="M260,90 C330,90 330,160 410,160" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/><path id="r1" d="M260,160 C330,160 330,160 410,160" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/><path id="r2" d="M260,230 C330,230 330,160 410,160" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/><path id="r3" d="M916,160 C960,160 960,90 1020,90" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/><path id="r4" d="M916,160 C960,160 960,160 1020,160" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/><path id="r5" d="M916,160 C960,160 960,230 1020,230" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/><path id="r6" d="M700,160 H804" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="60" y="68" width="200" height="44" rx="22" fill="#0b0b0d" stroke="#fff" stroke-opacity="0.3"/><text x="160" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ededed">Claude</text><rect x="60" y="138" width="200" height="44" rx="22" fill="#0b0b0d" stroke="#fff" stroke-opacity="0.3"/><text x="160" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ededed">ChatGPT</text><rect x="60" y="208" width="200" height="44" rx="22" fill="#0b0b0d" stroke="#fff" stroke-opacity="0.3"/><text x="160" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ededed">Any MCP app</text><rect x="1020" y="68" width="200" height="44" rx="22" fill="#0b0b0d" stroke="#fff" stroke-opacity="0.3"/><text x="1120" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ededed">Text</text><rect x="1020" y="138" width="200" height="44" rx="22" fill="#0b0b0d" stroke="#fff" stroke-opacity="0.3"/><text x="1120" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ededed">Image</text><rect x="1020" y="208" width="200" height="44" rx="22" fill="#0b0b0d" stroke="#fff" stroke-opacity="0.3"/><text x="1120" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ededed">Video</text>
    <!-- Your deployment -->
    <rect x="410" y="104" width="290" height="112" rx="20" fill="#0e0e10" stroke="#fff" stroke-opacity="0.45"/>
    <g transform="translate(436,128) scale(1.6)"><path d="M9.5 25V14.5a6.5 6.5 0 0 1 13 0V25" fill="none" stroke="#ededed" stroke-width="2.2" stroke-linecap="round" transform="translate(-9.5,-8)"/><circle cx="6.5" cy="10.5" r="2.4" fill="#fff"/></g>
    <text x="490" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ededed">Your copy on Vercel</text>
    <text x="490" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8a8a8a">you.vercel.app/mcp/••••</text>
    <text x="490" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#8a8a8a">SECRET CHECKED HERE</text>
    <!-- AI Gateway -->
    <circle cx="860" cy="160" r="56" fill="#0e0e10" stroke="#fff" stroke-opacity="0.55"/>
    <circle cx="860" cy="160" r="70" fill="none" stroke="#fff" stroke-opacity="0.15"/>
    <circle cx="860" cy="160" r="70" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="60 380" stroke-linecap="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 860 160" to="360 860 160" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="860" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed">AI Gateway</text>
    <text x="860" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#8a8a8a">OIDC · NO KEY</text>
    <circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="0.0s;r0d.end+1.6s" id="r0d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="0.0s;r0d.end+1.6s"/></circle><circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="0.5s;r1d.end+1.6s" id="r1d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="0.5s;r1d.end+1.6s"/></circle><circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="1.0s;r2d.end+1.6s" id="r2d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="1.0s;r2d.end+1.6s"/></circle><circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="1.6s;r3d.end+1.6s" id="r3d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="1.6s;r3d.end+1.6s"/></circle><circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="2.1s;r4d.end+1.6s" id="r4d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="2.1s;r4d.end+1.6s"/></circle><circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="2.6s;r5d.end+1.6s" id="r5d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="2.6s;r5d.end+1.6s"/></circle><circle r="3.5" fill="#fff" filter="url(#glow)" opacity="0"><animateMotion dur="1.4s" begin="1.2s;r6d.end+1.6s" id="r6d" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#r6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="1.2s;r6d.end+1.6s"/></circle>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#8a8a8a">
      <text x="160" y="312" text-anchor="middle">1 · YOU ASK IN CHAT</text>
      <text x="555" y="312" text-anchor="middle">2 · YOUR DEPLOYMENT CALLS</text>
      <text x="860" y="312" text-anchor="middle">3 · BILLED TO YOUR CREDITS</text>
      <text x="1120" y="312" text-anchor="middle">4 · ANY MODEL ANSWERS</text>
